<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img">
<rect width="760" height="296" fill="#ffffff"/>
<text x="380" y="24" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Visitors to four types of cultural institution, 2005, 2015 and 2025 (millions)</text>
