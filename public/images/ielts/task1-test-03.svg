<text x="465" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">2015</text>
<text x="635" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">2025</text>

