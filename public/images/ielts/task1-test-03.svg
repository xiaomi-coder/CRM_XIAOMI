<text x="295" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">28.6</text>
<text x="465" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">21.3</text>
<text x="635" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0f172a" text-anchor="middle">14.7</text>

